name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TicTacToe.sln

      - name: Build
        run: dotnet build TicTacToe.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test TicTacToe.sln --no-build --configuration Release

      - name: Scan vulnerable packages
        run: |
          dotnet list TicTacToe.sln package --vulnerable --include-transitive | tee vulnerabilities.txt
          if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
            echo "Vulnerable packages found"
            exit 1
          fi
